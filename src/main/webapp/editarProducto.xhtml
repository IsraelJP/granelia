<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    
    <h:head>
        <title>Editar Producto</title>
        <style>
            body { 
                font-family: Arial; 
                padding: 20px; 
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
            }
            .container { 
                max-width: 600px; 
                margin: 50px auto; 
                background: white; 
                padding: 30px; 
                border-radius: 10px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            }
            h1 {
                color: #333;
                margin-bottom: 30px;
                text-align: center;
            }
            .form-group { 
                margin-bottom: 20px; 
            }
            .form-group label { 
                display: block; 
                margin-bottom: 8px; 
                font-weight: bold;
                color: #555;
            }
            .form-group input { 
                width: 100%; 
                padding: 12px; 
                border: 2px solid #ddd; 
                border-radius: 6px;
                font-size: 1em;
                transition: border 0.3s;
            }
            .form-group input:focus {
                outline: none;
                border-color: #667eea;
            }
            .imagen-actual {
                width: 150px;
                height: 150px;
                object-fit: cover;
                border-radius: 10px;
                border: 3px solid #ddd;
                display: block;
                margin: 10px 0;
            }
            .btn { 
                padding: 12px 30px; 
                border: none; 
                border-radius: 6px; 
                cursor: pointer; 
                font-size: 1em;
                font-weight: bold;
                margin-right: 10px;
                transition: all 0.3s;
            }
            .btn-warning { 
                background: #FF9800; 
                color: white;
            }
            .btn-warning:hover {
                background: #FB8C00;
                transform: translateY(-2px);
            }
            .btn-secondary { 
                background: #6c757d; 
                color: white;
            }
            .btn-secondary:hover {
                background: #5a6268;
            }
            .button-group {
                text-align: center;
                margin-top: 30px;
            }
            .alert {
                padding: 15px;
                margin-bottom: 20px;
                border-radius: 6px;
            }
            .alert-success {
                background: #d4edda;
                color: #155724;
                border: 1px solid #c3e6cb;
            }
            .alert-error {
                background: #f8d7da;
                color: #721c24;
                border: 1px solid #f5c6cb;
            }
        </style>
    </h:head>
    
    <h:body>
        <f:view>
            <div class="container">
                <h1>✏️ Editar Producto</h1>
                
                <h:form enctype="multipart/form-data">
                    <h:messages styleClass="alert alert-error" />
                    
                    <div class="form-group">
                        <label>ID:</label>
                        <h:inputText value="#{products.productoActual.id_producto}" 
                                     readonly="true" 
                                     style="background: #f5f5f5;" />
                    </div>
                    
                    <div class="form-group">
                        <label>Nombre: *</label>
                        <h:inputText value="#{products.productoActual.nombre}" required="true" />
                    </div>
                    
                    <div class="form-group">
                        <label>Marca: *</label>
                        <h:inputText value="#{products.productoActual.marca}" required="true" />
                    </div>
                    
                    <div class="form-group">
                        <label>Categoría: *</label>
                        <h:inputText value="#{products.productoActual.categoria}" required="true" />
                    </div>
                    
                    <div class="form-group">
                        <label>Peso (gramos): *</label>
                        <h:inputText value="#{products.productoActual.peso_gramos}" required="true" />
                    </div>
                    
                    <div class="form-group">
                        <label>Precio: *</label>
                        <h:inputText value="#{products.productoActual.precio}" required="true" />
                    </div>
                    
                    <div class="form-group">
                        <label>Stock: *</label>
                        <h:inputText value="#{products.productoActual.stock}" required="true" />
                    </div>
                    
                    <div class="form-group">
                        <label>Imagen Actual:</label>
                        <h:graphicImage value="/resources/images/#{products.productoActual.imagen}" 
                                        styleClass="imagen-actual"
                                        rendered="#{products.productoActual.imagen != null and products.productoActual.imagen != ''}" />
                        <p style="color: #999;" rendered="#{products.productoActual.imagen == null or products.productoActual.imagen == ''}">
                            Sin imagen
                        </p>
                    </div>
                    
                    <div class="form-group">
                        <label>Cambiar Imagen (opcional):</label>
                        <h:inputFile value="#{products.file}" />
                        <small style="color: #999;">Deja vacío si no quieres cambiar la imagen</small>
                    </div>
                    
                    <div class="button-group">
                        <h:commandButton value="💾 Guardar Cambios" 
                                         action="#{products.actualizarProducto()}" 
                                         styleClass="btn btn-warning" />
                        
                        <h:button value="❌ Cancelar" 
                                  outcome="catalogo"
                                  styleClass="btn btn-secondary" />
                    </div>
                </h:form>
            </div>
        </f:view>
    </h:body>
</html>
